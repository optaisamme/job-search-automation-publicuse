# =====================================================================
#  EDIT ME  (file 3 of 3, optional): WHEN THE SEARCH RUNS
# =====================================================================
#  The only line you may want to change is the "cron" line below.
#  Format: "minute hour * * day-of-week", in UTC time.
#    - Mountain Time = UTC minus 7 in winter, minus 6 in summer.
#    - Days: 0 = Sunday, 1 = Monday ... 5 = Friday, 6 = Saturday.
#  Examples:
#    "47 13 * * 5"  = Fridays at 13:47 UTC (6:47 AM Mountain in winter)
#    "0 15 * * 1"   = Mondays at 15:00 UTC (8:00 AM Mountain in winter)
#    "0 15 * * 1,4" = Mondays and Thursdays at 15:00 UTC
#  Do not change anything else in this file.
#  To run a search now instead of waiting: see HOW_TO_RUN_A_SEARCH_NOW.md.
# =====================================================================

name: Weekly job search

on:
  schedule:
    # Fridays 13:47 UTC = 6:47 AM Mountain Standard Time (7:47 AM during daylight time).
    - cron: "47 13 * * 5"
  workflow_dispatch: {}   # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write   # save results back to this repository
  issues: write     # post results as an issue

concurrency:
  group: weekly-job-search
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest is moving to Ubuntu 26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check settings files
        run: python -m jobsearch check

      - name: Install headless browser (reads job pages that need JavaScript)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.64.1
          npx playwright install --with-deps chromium

      - name: Search for jobs
        env:
          # Optional free API keys (Settings > Secrets and variables > Actions). Leave unset to skip.
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python -m jobsearch run

      - name: Re-check links and prepare results
        run: python -m jobsearch outbox prepare

      - name: Post results as an issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/publish_github_issue.py

      - name: Update RESULTS.md and show results on this page
        if: always()
        run: python scripts/write_results_page.py

      - name: Save results to the repository
        if: always()
        run: |
          git config user.name "job-search-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports RESULTS.md || true
          git diff --cached --quiet && echo "No changes to save." && exit 0
          git commit -m "Weekly job search results $(date -u +%Y-%m-%d)"
          git push

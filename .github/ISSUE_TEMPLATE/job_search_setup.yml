name: Job search setup
description: Set up or change your job search by answering questions. No coding or file editing.
title: "Job search setup"
body:
  - type: markdown
    attributes:
      value: |
        ### How this works
        1. Answer the questions below. **Only the first one is required.**
        2. Click the green **Create** button at the bottom (it may say **Submit new issue**).
        3. GitHub then shows your answers on a new page. **Stay on that page.** In 1 to 2 minutes a reply
           appears at the bottom (refresh the page if it does not), saying what was saved, or what to fix.
        4. If a search started, the reply begins with a link to watch it. Any time, to see searches:
           click the **Actions** tab at the top of your copy, then **Run job search** on the left. A yellow dot means a search is running; a green check means it finished.

        **Good to know:** leave a question empty, or a dropdown on "None", to keep your current setting.
        Type `none` in a text box to clear it.
        For lists, put one item on each line. Only you (and collaborators you add) can change your settings.

  - type: markdown
    attributes:
      value: "## Step 1 of 9: The jobs you want"
  - type: textarea
    attributes:
      label: Job titles to look for
      description: "Put all your job titles in this box, one per line, as many as you like. Senior, Sr. and Lead versions are found too, and the words can be in any order."
      placeholder: |
        Program Manager
        Program Director
        Data Analyst
      render: text
    validations:
      required: true

  - type: markdown
    attributes:
      value: "## Step 2 of 9: Where you can work"
  - type: dropdown
    attributes:
      label: Remote jobs only?
      options:
        - Yes, remote jobs only
        - No, also hybrid and on-site jobs in my state
  - type: input
    attributes:
      label: Your state
      description: "Full state name. Jobs that cannot hire in your state are left out. Example: New Mexico"
  - type: input
    attributes:
      label: Your state's two-letter abbreviation
      description: "Example: NM"
  - type: textarea
    attributes:
      label: Cities where you could work on site
      description: Optional. One city per line. Only used if you chose "No" for remote jobs only.
      render: text

  - type: markdown
    attributes:
      value: "## Step 3 of 9: Pay (per year, numbers only, 0 = no minimum)"
  - type: input
    attributes:
      label: Lowest single salary you would accept
      description: "For jobs that list one salary. Example: 100000"
  - type: input
    attributes:
      label: Lowest acceptable start of a salary range
      description: "For jobs that list a range like $85,000 to $110,000: the low end must be at least this. Example: 90000"
  - type: input
    attributes:
      label: A salary range must end above
      description: "The high end of a range must be more than this. Example: 100000"

  - type: markdown
    attributes:
      value: "## Step 4 of 9: Jobs to leave out (optional)"
  - type: textarea
    attributes:
      label: Title words to skip
      description: "One per line. Only the job TITLE is checked, never the rest of the posting. Whole words, capitals do not matter. Example: Intern"
      render: text
  - type: textarea
    attributes:
      label: Words the job description must mention
      description: One per line. A job must mention at least one of them, or it is left out.
      render: text
  - type: dropdown
    attributes:
      label: Check certification requirements?
      description: If Yes, jobs that require a certification you do not list in the next question are left out.
      options:
        - "No"
        - "Yes"
  - type: textarea
    attributes:
      label: Certifications you have, or could get before being hired
      description: One per line.
      render: text

  - type: markdown
    attributes:
      value: "## Step 5 of 9: Employers to skip (optional)"
  - type: textarea
    attributes:
      label: Employers to skip
      description: "One employer per line. Jobs from these employers are never shown, and their careers pages are not read. Whole words, capitals do not matter: Acme skips Acme Corp, not Acmeworks."
      render: text

  - type: markdown
    attributes:
      value: "## Step 6 of 9: About you (optional: shows how well each job fits you)"
  - type: textarea
    attributes:
      label: Your skills
      description: "One skill per line, only skills you have used. To also catch other wording, add a colon and the words a job posting might use, separated by commas, as in the example. Your answer replaces your current skill list."
      placeholder: |
        Reports and dashboards: report, dashboard
        Data cleanup: data quality, dedup, import
      render: text
  - type: input
    attributes:
      label: Years of experience in your field
      description: "A number. Jobs asking for more years are flagged, never removed. Example: 3"
  - type: textarea
    attributes:
      label: Certifications you hold
      description: One per line.
      render: text

  - type: markdown
    attributes:
      value: "## Step 7 of 9: More ways to find jobs (optional)"
  - type: textarea
    attributes:
      label: Companies to watch
      description: "Links to company job pages on Greenhouse, Lever, Ashby or SmartRecruiters, one per line. Every job there is checked. Example: https://job-boards.greenhouse.io/examplecompany"
      render: text
  - type: markdown
    attributes:
      value: |
        ### Skills-based matching
        Also finds jobs with other titles, when the listing includes your keywords and enough of your skills (Step 6).
  - type: dropdown
    attributes:
      label: Turn on skills-based matching?
      options:
        - "Off"
        - "On"
  - type: input
    attributes:
      label: How many of your skills must the listing mention?
      description: "A number. 3 is a good start."
  - type: textarea
    attributes:
      label: Keywords the listing must include
      description: "One per line. Example: Salesforce"
      render: text
  - type: dropdown
    attributes:
      label: All keywords, or at least one?
      options:
        - All of them
        - At least one

  - type: markdown
    attributes:
      value: |
        ## Step 8 of 9: How many jobs to look through
        **We recommend keeping "Recommended" for now.** Some job sites offer thousands of jobs. This sets how many
        the search reads from Himalayas, The Muse and Jobicy. Reading more makes each search take longer, and
        GitHub stops a search after 60 minutes.
  - type: dropdown
    attributes:
      label: How many jobs to look through
      description: "In a test search on 2026-11-06, Recommended read 3,763 job listings in about 11 minutes (without the web search). More job titles make a search longer."
      options:
        - "Recommended: 1,000 newest jobs per site, 200 for each job title, Jobicy up to 5,000"
        - "Fewer (faster): 200 newest jobs per site, 100 for each job title, Jobicy up to 500"
        - "More (slower): 2,000 newest jobs per site, 400 for each job title, Jobicy up to 10,000"
      default: 0

  - type: markdown
    attributes:
      value: "## Step 9 of 9: When to search"
  - type: dropdown
    attributes:
      label: Automatic weekly searches
      description: On = a search also runs by itself once a week.
      options:
        - "Off"
        - "On"
  - type: dropdown
    attributes:
      label: Day for automatic weekly searches
      description: The search starts around 13:47 UTC (about 6:47 AM Mountain in winter, 7:47 AM in summer).
      options:
        - Monday
        - Tuesday
        - Wednesday
        - Thursday
        - Friday
        - Saturday
        - Sunday
  - type: dropdown
    attributes:
      label: Start a search right after saving?
      description: "Yes starts a search as soon as your settings are saved. To watch it, use the link in the reply on the next page, or the Actions tab, then Run job search."
      options:
        - "Yes"
        - "No"
      default: 0
